
name: Diary Store CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Check Website Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All website files are present."

      - name: Check JavaScript Syntax
        run: node --check script.js

      - name: Verify HTML File
        run: |
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          echo "Basic HTML check passed."

      - name: Verify CSS File
        run: |
          test -s style.css
          echo "CSS file check passed."

  deploy:
    name: Deploy Website
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website Files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
