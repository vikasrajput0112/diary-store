
name: Diary Store CI/CD


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Check Website Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All website files are present."

      - name: Check JavaScript Syntax
        run: node --check script.js

      - name: Verify HTML File
        run: |
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          echo "Basic HTML check passed."

      - name: Verify CSS File
        run: |
          test -s style.css
          echo "CSS file check passed."
